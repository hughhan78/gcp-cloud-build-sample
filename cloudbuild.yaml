steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/hugh-demo-app', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/hugh-demo-app']

images:
  - 'gcr.io/$PROJECT_ID/hugh-demo-app'


options:
  logging: CLOUD_LOGGING_ONLY
